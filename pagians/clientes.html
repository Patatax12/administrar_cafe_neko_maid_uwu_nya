<!DOCTYPE html>
<html lang="esp">
<head>
  <meta charset="UTF-8">
  <title>Gestion de Clientes</title>
  <link rel="stylesheet" href="../css/gestion-sesiones.css">
</head>
<body>
  <h1>Gestion de Clientes</h1>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="sesion.html">Registro de Sesion</a>
    <a href="historial.html">Historial</a>
  </nav>

  <div class="card">
    <h2>Buscar cliente por correo</h2>
    <input type="text" id="buscorreo" placeholder="ej: juan@correo.com">
    <button type="button" id="btnbusc">Buscar</button>
    <button type="button" id="btntodos">Mostrar todos</button>
  </div>

  <div class="card">
    <h2>Registrar nuevo cliente</h2>
    <form id="formcli">
      <label>Nombre:</label>
      <input type="text" id="nomcli" required minlength="2">

      <label>Correo:</label>
      <input type="email" id="corcli" required>

      <button type="submit">Registrar</button>
    </form>
  </div>

  <div class="card">
    <h2>Clientes registrados</h2>
    <table id="tablacli" border="1">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Accion</th>
        </tr>
      </thead>
      <tbody>
        <!-- Las filas se generan con JavaScript -->
      </tbody>
    </table>
  </div>

  <script src="../js/clientes.js"></script>
</body>
</html>
