<!DOCTYPE html>
<html lang="esp">
<head>
  <meta charset="UTF-8">
  <title>Historial de Sesiones</title>
  <link rel="stylesheet" href="../css/gestion-sesiones.css">
</head>
<body>
  <h1>Historial de Sesiones</h1>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="clientes.html">Clientes</a>
    <a href="sesion.html">Registro de Sesion</a>
  </nav>

  <div class="card">
    <h2>Filtros</h2>
    <label>Fecha:</label>
    <input type="text" id="filtfech" placeholder="ej: 10/09/2026">

    <label>Computador:</label>
    <select id="filtcomp">
      <option value="">Todos</option>
    </select>

    <label>Cliente:</label>
    <select id="filtcl">
      <option value="">Todos</option>
    </select>

    <button type="button" id="btnfilt">Filtrar</button>
    <button type="button" id="btnlimp">Limpiar filtros</button>
  </div>

  <div class="card">
    <h2>Sesiones registradas</h2>
    <table id="tablahist" border="1">
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Computador</th>
          <th>Fecha</th>
          <th>Hora inicio</th>
          <th>Hora fin</th>
          <th>Duracion (min)</th>
          <th>Monto final</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../js/historial.js"></script>
</body>
</html>
