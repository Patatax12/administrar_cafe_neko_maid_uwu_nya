<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="../manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NekoCuentas - Café Neko Maid Uwu Nya</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        :root {
            --bg-dark: #121212;
            --panel-bg: #1e1e1e;
            --neon-pink: #ff80bf;
            --neon-green: #69f0ae;
            --danger-red: #ff5252;
            --border-color: #333;
        }
        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        nav {
            background-color: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            box-shadow: 0 4px 15px rgba(255, 128, 191, 0.1);
        }
        nav a {
            color: var(--neon-pink);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        nav a:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--neon-pink);
        }
        h1 { color: var(--neon-pink); margin-top: 0; }
        p.subtitle { color: #aaa; margin-bottom: 25px; }
        .contenedor {
            display: flex;
            gap: 25px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .columna {
            flex: 1;
            min-width: 320px;
            background-color: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 8px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 15px 12px;
            text-align: left;
        }
        th {
            background-color: #2a2a2a;
            color: var(--neon-pink);
            font-weight: 600;
        }
        tr:hover { background-color: #252525; }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-peligro { background-color: var(--danger-red); color: white; }
        .btn-peligro:hover { box-shadow: 0 0 10px var(--danger-red); }
        .btn-desbloquear { background-color: #555; color: white; }
        .btn-desbloquear:hover { background-color: #777; }
        .btn-guardar {
            background-color: var(--neon-green);
            color: var(--bg-dark);
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            font-size: 1.1em;
        }
        .btn-guardar:hover { box-shadow: 0 0 12px var(--neon-green); }
        label { display: block; margin-top: 15px; color: #ddd; font-size: 0.9em;}
        input, select {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background-color: #2a2a2a;
            color: white;
            border: 1px solid #555;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--neon-green);
            box-shadow: 0 0 5px rgba(105, 240, 174, 0.3);
        }
    </style>
</head>
<body>
    <nav>
        <a href="inicio_admin.html">Panel del NekoAdmin</a>
        <a href="gestion_computadoras.html">Gestión de NekoComputadoras</a>
        <a href="gestion_cuentas.html">Gestión de NekoCuentas</a>
        <a href="../index.html">Neko volver UnU</a>
    </nav>
    <h1>Gestion de las NekoCuentas</h1>
    <p class="subtitle">Administra los perfiles de los clientes y el staff del cyber.</p>

    <div class="contenedor" x-data="{
    busqueda: '',
    usuarios: [
        { nombre: 'Ariel', rol: 'NekoAdmin', estado: 'Activo', color: 'var(--neon-green)' },
        { nombre: 'Santiago', rol: 'Cliente', estado: 'Activo', color: 'var(--neon-green)' },
        { nombre: 'Gabriel', rol: 'Cliente', estado: 'Suspendido', color: 'var(--danger-red)' },
        { nombre: 'Benjamín', rol: 'Cliente', estado: 'Activo', color: 'var(--neon-green)' }
    ]
}">
        <div class="columna">
            <h2>NekoUsuarios Registrados</h2>
            <div class="buscador-container">
            <input type="text" x-model="busqueda" placeholder="Filtrar usuario por nombre" aria-label="Buscar usuario por nombre" />
            </div>
            <table>
                <thead>
                    <tr>
                        <th>NekoUsuario</th>
                        <th>NekoRol</th>
                        <th>NekoEstado</th>
                        <th>NekoAcción</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="usuario in usuarios.filter(u => u.nombre.toLowerCase().includes(busqueda.toLowerCase()))">
                        <tr>
                            <td x-text="usuario.nombre"></td>
                            <td x-text="usuario.rol"></td>
                            <td :style="'color: ' + usuario.color" x-text="usuario.estado"></td>
                            <td>
                                <button x-show="usuario.estado === 'Activo'" class="btn btn-peligro" @click="usuario.estado = 'Suspendido'; usuario.color = 'var(--danger-red)'">Bloquear</button>
                                <button x-show="usuario.estado === 'Suspendido'" class="btn btn-desbloquear" @click="usuario.estado = 'Activo'; usuario.color = 'var(--neon-green)'">Desbloquear</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
        <div class="columna">
            <h2>Crear Nueva NekoCuenta</h2>
            <form x-data="{ nuevoNombre: '', nuevoRol: 'cliente', nuevoSaldo: '' }"
                  @submit.prevent="
                      usuarios.push({
                          nombre: nuevoNombre,
                          rol: nuevoRol === 'admin' ? 'NekoAdmin' : 'Cliente',
                          estado: 'Activo',
                          color: 'var(--neon-green)'
                      });
                      nuevoNombre = '';
                      nuevoSaldo = '';
                      alert('¡NekoCuenta creada exitosamente uwu!');
                  ">
                <label for="nombre">Nombre del NekoUsuario:</label>
                <input type="text" id="nombre" x-model="nuevoNombre" placeholder="Ej: NekoUser99" required minlength="3">
                <label for="rol">NekoRol en el sistema:</label>
                <select id="rol" x-model="nuevoRol">
                    <option value="cliente">NekoCliente (Cyber)</option>
                    <option value="admin">NekoAdmin</option>
                </select>
                <label for="saldo">Saldo inicial (NekoHoras):</label>
                <input type="number" id="saldo" x-model="nuevoSaldo" placeholder="Ej: 2" required min="1">
                <button type="submit" class="btn btn-guardar">Registrar NekoUsuario</button>
            </form>
        </div>
    </div>
    <script>
    if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js');
    });
    }
</script>
</body>
</html>
