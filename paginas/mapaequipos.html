<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCafeNeko:3 - Mapa de Equipos</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/panel.css">
    <script src="../js/mapaequipos.js" defer></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h2 class="sidebar-titulo">CyberCafeNeko:3</h2>
            <nav>
                <a href="../index.html">Inicio</a>
                <a href="mapaequipos.html" class="activo">Mapa de Equipos</a>
                <a href="clientes.html">Gestión de NekoClientes</a>
                <a href="sesion.html">Registro de Sesión</a>
                <a href="historial.html">Historial de NekoSesiones</a>
                <a href="inicio_admin.html">Admin meow >:3</a>
            </nav>
            <a href="login.html" class="cerrar-sesion">Cerrar sesión</a>
        </aside>

        <main class="contenido" x-data="mapa">
            <h1>Mapa de Equipos</h1>

            <button @click="filtro = ''">Todos</button>
            <button @click="filtro = 'disponible'">Disponible</button>
            <button @click="filtro = 'ocupado'">Ocupado</button>
            <button @click="filtro = 'reservado'">Reservado</button>
            <button @click="filtro = 'fuera de servicio'">Fuera de servicio</button>

            <template x-if="equipoElegido">
                <div>
                    <p>Iniciar sesión en <span x-text="equipoElegido.codigo"></span></p>
                    <select x-model="clienteElegido">
                        <option value="">Elige un cliente</option>
                        <template x-for="c in clientes">
                            <option x-text="c"></option>
                        </template>
                    </select>
                    <p x-text="error"></p>
                    <button @click="iniciarSesion()">Iniciar</button>
                    <button @click="cancelar()">Cancelar</button>
                </div>
            </template>

            <div class="grilla-equipos">
                <template x-for="pc in visibles()">
                    <div class="tarjeta-equipo" @click="clickEquipo(pc)">
                        <div class="tarjeta-equipo-header">
                            <span class="tarjeta-equipo-codigo" x-text="pc.codigo"></span>
                            <span class="indicador-estado" :class="claseEstado(pc.estado)" x-text="textoEstado(pc.estado)"></span>
                        </div>
                        <p class="tarjeta-equipo-nombre" x-text="pc.nombre"></p>
                        <p class="tarjeta-equipo-ubicacion" x-text="pc.ubicacion"></p>
                    </div>
