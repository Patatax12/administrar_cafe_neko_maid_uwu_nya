<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCafeNeko:3 - Gestión de Clientes 7w7</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/panel.css">
    <link rel="stylesheet" href="../css/gestsesiones.css">
    <script defer src="../js/clientes.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>



<body>
    <div class="layout">
        <aside class="sidebar">
            <h2 class="sidebar-titulo">CyberCafeNeko:3</h2>
            <nav>
                <a href="../index.html">Inicio</a>
                <a href="mapaequipos.html">Mapa de Equipos</a>
                <a href="clientes.html" class="activo">Gestión de NekoClientes</a>
                <a href="sesion.html">Registro de Sesión</a>
                <a href="historial.html">Historial de NekoSesiones</a>
                <a href="inicio_admin.html">Admin meow >:3</a>
            </nav>
            <a href="login.html" class="cerrar-sesion">Cerrar sesión</a>
        </aside>

        <main class="contenido" x-data="clientesApp">
            <h1>Gestión de Clientes</h1>

            <div class="card">
                <h2>Buscar cliente por nombre</h2>
                <div class="campo">
                    <input type="text" x-model="busqueda" placeholder="ej: juan carlos bodoque">
                </div>
            </div>

            <div class="card">
                <h2>Registrar nuevo cliente</h2>
                <form @submit.prevent="registrar()">
                    <div class="campo">
                        <label>Nombre:</label>
                        <input type="text" x-model="nombre" required>
                    </div>
                    <div class="campo">
                        <label>Correo:</label>
                        <input type="email" x-model="correo" required>
                    </div>
                    <button type="submit">Registrar</button>
                </form>
            </div>

            <div class="card">
                <h2>Clientes registrados</h2>
                <table id="tablacli">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="c in admin.buscar(busqueda)" :key="c.id">
                            <tr>
                                <td x-text="c.id"></td>
                                <td x-text="c.nombre"></td>
                                <td x-text="c.correo"></td>
                                <td>
                                    <button type="button" @click="editar(c)">Editar</button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>                
            </div>
        </main>
    </div>
  </body>
</html>
