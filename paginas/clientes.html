        <main class="contenido">
            <h1>Gestión de Clientes</h1>

            <div class="card">
                <h2>Buscar cliente por correo</h2>
                <div class="campo">
                    <input type="text" id="buscorreo" placeholder="ej: juan@correo.com">
                </div>
                <button type="button" id="btnbusc">Buscar</button>
                <button type="button" id="btntodos">Mostrar todos</button>
            </div>

            <div class="card">
                <h2>Registrar nuevo cliente</h2>
                <form id="formcli">
                    <div class="campo">
                        <label>Nombre:</label>
                        <input type="text" id="nomcli">
                    </div>
                    <div class="campo">
                        <label>Correo:</label>
                        <input type="email" id="corcli" required>
                    </div>
                    <button type="submit">Registrar</button>
                </form>
            </div>

            <div class="card">
                <h2>Clientes registrados</h2>
                <table id="tablacli">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                  
                    </tbody>
                </table>
            </div>
        </main>
    </div>
      <script src="../js/clientes.js"></script>
