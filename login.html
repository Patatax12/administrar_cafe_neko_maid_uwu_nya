<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/login.js" defer></script>
</head>
<body>
     <div class="login-container">
        <h1>CyberCafeNeko:3</h1>
        <p>Fase prueba y error/aprendizaje</p>

        <form id="form-login">
            <div class="campo">
                <label for="usuario">Presentese :v</label>
                <input type="text" id="usuario" name="usuario" placeholder="Presentate po loco" required>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required>
            </div>

            <p class="mensaje-error" id="mensaje-error"></p>

            <button type="submit">Meterse</button>
        </form>
    </div>
</body>
</html>
