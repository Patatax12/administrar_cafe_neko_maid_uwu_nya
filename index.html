<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCafeNeko:3 - Inicio</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/panel.css">
    <script src="js/inicioencargado.js" defer></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body>
     <div class="layout">
        <aside class="sidebar"> 
            <h2 class="sidebar-titulo">CyberCaféNeko :3</h2>
            <nav>
                <a href="index.html" class="activo">Inicio</a>
                <a href="paginas/mapaequipos.html">Mapa de Equipos</a>
                <a href="paginas/clientes.html">Gestión de NekoClientes</a>
                <a href="paginas/sesion.html">Registro de Sesión</a>
                <a href="paginas/historial.html">Historial de NekoSesiones</a>
                <a href="paginas/inicio_admin.html">Admin meow >:3</a>
            </nav>
            <a href="paginas/login.html" class="cerrar-sesion">Cerrar sesión</a>
        </aside>

        <main class="contenido" x-data="inicio">
            <h1>Inicio</h1>

            <div class="tarjetas-resumen">
                <div class="tarjeta">
                    <p class="tarjeta-etiqueta">Total recaudado hoy</p>
                    <p class="tarjeta-valor" x-text="'$' + totalRecaudado.toLocaleString('es-CL')"></p>
                </div>
                <div class="tarjeta">
                    <p class="tarjeta-etiqueta">Computadores disponibles</p>
                    <p class="tarjeta-valor" x-text="disponibles()"></p>
                </div>
                <div class="tarjeta">
                    <p class="tarjeta-etiqueta">Sesiones activas</p>
                    <p class="tarjeta-valor" x-text="sesiones.length"></p>
                </div>
            </div>

            <h2>Sesiones activas</h2>
            <table class="tabla-sesiones">
                <thead>
                    <tr>
                        <th @click="ordenar('cliente')" style="cursor:pointer">Cliente</th>
                        <th @click="ordenar('computador')" style="cursor:pointer">Computador</th>
                        <th @click="ordenar('horaInicio')" style="cursor:pointer">Hora de inicio</th>
                        <th>Tiempo transcurrido</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody>
                    <template x-for="s in sesiones" :key="s.computador">
                        <tr>
                            <td x-text="s.cliente"></td>
                            <td x-text="s.computador"></td>
                            <td x-text="s.horaInicio"></td>
                            <td x-text="minutos(s) + ' min'"></td>
                            <td><button class="boton-finalizar" @click="finalizar(s)">Finalizar</button></td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </main>
    </div>
    
</body>
</html>
